<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R1</title>
<link rel="stylesheet" href="../../../catalog.css">
</head>
<body>
  <div class="top">
    <a class="icon-btn" href="../index.html">⬅ Atrás</a>
    <button class="icon-btn" type="button" id="btn-tema">🌙 Oscuro</button>
    <a class="icon-btn" href="../../../index.html">✕ Cerrar</a>
  </div>

  <p class="muted">Motocicletas · Yamaha · R1</p>
  <h1>R1</h1>
  <p class="muted">Página de catálogo. Guarda conectores V1/V2 desde la app principal en Base de datos.</p>

  <a class="boton" href="../../../index.html#nuevo">➕ Crear conector 12V</a>
  <a class="boton" href="../../../index.html#db">📁 Ver base de datos</a>
  <a class="boton" href="../index.html">⬅ Volver a Yamaha</a>

  <script>
    (function () {
      const key = "cg_theme";
      const apply = (t) => {
        document.documentElement.setAttribute("data-theme", t);
        localStorage.setItem(key, t);
        document.getElementById("btn-tema").textContent = t === "dark" ? "☀ Claro" : "🌙 Oscuro";
      };
      apply(localStorage.getItem(key) || "light");
      document.getElementById("btn-tema").onclick = () => {
        const cur = document.documentElement.getAttribute("data-theme");
        apply(cur === "dark" ? "light" : "dark");
      };
    })();
  </script>
</body>
</html>
